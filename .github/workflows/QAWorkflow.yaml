name: QAWorkflow

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: florxha
          POSTGRES_PASSWORD: mydb123
          POSTGRES_DB: florxha_tp3
        options: >-
          --health-cmd "pg_isready -U florxha -d florxha_tp3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
            go-version: 1.21

      - name: Wait for PostgreSQL to be ready
        run: until pg_isready -h localhost -U florxha -d florxha_tp3; do echo "Waiting for database"; sleep 5; done

      - name: Build
        uses: ./.github/actions/build
        with:
          target-directory: './'
          
      - name: Linter
        uses: ./.github/actions/linter
        with:
          target-directory: './'
          
      - name: Run Tests with Coverage
        uses: ./.github/actions/tests
        with:
          target-directory: './tests'
