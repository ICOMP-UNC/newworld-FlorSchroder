name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: florxha
          POSTGRES_PASSWORD: mydb123
          POSTGRES_DB: florxha_tp3
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.16

      - name: Run Tests
        run: go test -v ./...
        env:
          DB_HOST: localhost
          DB_USER: florxha
          DB_PASSWORD: mydb123
          DB_NAME: florxha_tp3
          DB_PORT: 5432