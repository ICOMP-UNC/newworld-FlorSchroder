name: 'Tests'
description: 'Run tests with a PostgreSQL service'
inputs:
  target-directory:
    description: 'The directory containing the Go code to be tested'
    required: true
    default: './tests'
runs:
  using: 'composite'
  steps:
    - name: Check out code
      run: git checkout
      shell: bash

    - name: Set up Go
      run: |
        wget https://dl.google.com/go/go1.16.linux-amd64.tar.gz
        sudo tar -xvf go1.16.linux-amd64.tar.gz
        sudo mv go /usr/local
        export GOROOT=/usr/local/go
        export GOPATH=$HOME/go
        export PATH=$GOPATH/bin:$GOROOT/bin:$PATH
      shell: bash

    - name: Run Tests
      run: |
        go test -v ${{ inputs.target-directory }}
      env:
        DB_HOST: localhost
        DB_USER: florxha
        DB_PASSWORD: mydb123
        DB_NAME: florxha_tp3
        DB_PORT: 5432
      shell: bash