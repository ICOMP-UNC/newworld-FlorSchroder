name: Tests
description: Run testing on Go code
inputs:
  target-directory:
    description: 'The directory containing the Go code to be tested'
    required: true
    default: './tests'
runs:
  using: 'composite'
  steps:
    - name: Run Tests with Coverage
      shell: bash
      id: coverage
      run: |
        go test -coverprofile=coverage.out ./...
        coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        echo "::set-output name=coverage::${coverage::-1}"

    - name: Check Coverage
      shell: bash
      run: |
        coverage=${{ steps.coverage.outputs.coverage }}
        if (( $(echo "$coverage > 20" | bc -l) )); then
          echo "Coverage is greater than 20%"
          exit 0
        else
          echo "Coverage is not greater than 20%"
          exit 1
        fi